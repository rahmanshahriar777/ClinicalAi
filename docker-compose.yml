# Local infrastructure for the Clinical AI Platform.
# Usage: docker compose up -d
# Qdrant is optional (blueprint §7.1: pgvector for MVP, Qdrant for scale):
#   docker compose --profile vector up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: clinical_postgres
    environment:
      POSTGRES_USER: clinical
      POSTGRES_PASSWORD: clinical
      POSTGRES_DB: clinical
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinical -d clinical"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: clinical_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    container_name: clinical_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/clinical-documents &&
      exit 0"

  qdrant:
    image: qdrant/qdrant
    container_name: clinical_qdrant
    profiles: ["vector"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Optional self-hosted IdP for AUTH_MODE=oidc (blueprint §11.1, Keycloak option)
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: clinical_keycloak
    profiles: ["oidc"]
    command: ["start-dev", "--http-port=8080"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"


  # ---------------------------------------------------------------------------
  # Application services (profile "app"): docker compose --profile app up
  # ---------------------------------------------------------------------------
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://clinical:clinical@postgres:5432/clinical
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      API_URL: http://localhost:4000
      CORS_ORIGINS: http://localhost:3000,http://localhost:8081
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
