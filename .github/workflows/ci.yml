name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 9.15.9
  NODE_VERSION: 20

jobs:
  quality:
    name: Lint · typecheck · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @app/shared --filter @app/db --filter @app/ai --filter @app/api-client build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: "**/coverage/**", if-no-files-found: ignore }

  api-e2e:
    name: API end-to-end (Postgres + Redis)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: clinical, POSTGRES_PASSWORD: clinical, POSTGRES_DB: clinical }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clinical" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://clinical:clinical@localhost:5432/clinical
      REDIS_URL: redis://localhost:6379
      JOBS_INLINE: "true"
      AI_PROVIDER: mock
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-ci-only-secret-0000
      FIELD_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      E2E: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @app/shared --filter @app/db --filter @app/ai build
      - run: pnpm --filter @app/db exec prisma migrate deploy || pnpm --filter @app/db exec prisma db push --accept-data-loss
      - run: pnpm db:seed
      - run: pnpm --filter @app/api test:e2e

  build-images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [quality]
    if: github.event_name == 'push'
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
        continue-on-error: true
